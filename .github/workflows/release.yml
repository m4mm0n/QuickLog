name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore QuickLog/QuickLog.csproj

      - name: Build
        run: dotnet build QuickLog/QuickLog.csproj --configuration Release --no-restore

      - name: Pack NuGet
        run: dotnet pack QuickLog/QuickLog.csproj --configuration Release --no-build --output nupkgs

      - name: Zip binaries
        shell: pwsh
        run: |
          $version = "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}" -replace '^v', ''
          $outDir  = "QuickLog/bin/Release/net10.0"
          $zipName = "QuickLog-$version-binaries.zip"
          Compress-Archive -Path "$outDir/QuickLog.dll","$outDir/QuickLog.pdb","$outDir/QuickLog.xml" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "VERSION=$version"  >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: QuickLog v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.ZIP_NAME }}
            nupkgs/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
